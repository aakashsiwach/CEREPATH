name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests — ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [backend, browser_agent, egress_proxy]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: ${{ matrix.component }}
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q backend/app browser_agent/app egress_proxy

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build

  containers:
    name: Container build validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: |
          POSTGRES_DB=cerepath POSTGRES_USER=cerepath POSTGRES_PASSWORD=ci-placeholder CEREPATH_OWNER_TOKEN=ci-placeholder BROWSER_INTERNAL_TOKEN=ci-placeholder docker compose config --quiet
      - name: Build API image
        run: docker build -t cerepath-api:ci backend
      - name: Build browser image
        run: docker build -t cerepath-browser:ci browser_agent
      - name: Build egress proxy image
        run: docker build -t cerepath-egress-proxy:ci egress_proxy
      - name: Build frontend image
        run: docker build -t cerepath-web:ci frontend

name: cerepath

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set values}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    cpus: "0.30"
    networks: [data]

  egress-proxy:
    build:
      context: ./egress_proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: "0.10"
    networks: [browser_control, browser_egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',3128),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  browser-agent:
    build:
      context: ./browser_agent
    restart: unless-stopped
    environment:
      BROWSER_INTERNAL_TOKEN: ${BROWSER_INTERNAL_TOKEN:?Set BROWSER_INTERNAL_TOKEN in .env}
      BROWSER_TIMEOUT_SECONDS: "20"
    shm_size: 1gb
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
      - /home/pwuser/.cache:size=512m
    security_opt:
      - no-new-privileges:true
      - seccomp=./browser_agent/seccomp_profile.json
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 3g
    cpus: "0.90"
    depends_on:
      egress-proxy:
        condition: service_healthy
    networks: [browser_control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CEREPATH_OWNER_TOKEN: ${CEREPATH_OWNER_TOKEN:?Set CEREPATH_OWNER_TOKEN in .env}
      BROWSER_INTERNAL_TOKEN: ${BROWSER_INTERNAL_TOKEN:?Set BROWSER_INTERNAL_TOKEN in .env}
      BROWSER_AGENT_URL: http://browser-agent:8001
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      browser-agent:
        condition: service_healthy
    mem_limit: 1g
    cpus: "0.35"
    networks: [data, browser_control]

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on: [api]
    mem_limit: 256m
    cpus: "0.10"
    networks: [browser_control]

volumes:
  postgres_data:

networks:
  data:
    internal: true
  browser_control:
    internal: true
  browser_egress:
